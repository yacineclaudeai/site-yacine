<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --text:#14213D; --muted:#5B677A; --line:#DCE0E8;

@media (prefers-color-scheme: dark){

    --bg:#0E1424; --surface:#172039; --text:#E9EDF5; --muted:#9BA7BE; --line:#2B3656;

:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172039; --text:#E9EDF5; --muted:#9BA7BE; --line:#2B3656;

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:30}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-text)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.brand small{font-weight:500;font-size:12px;background:var(--accent);color:var(--accent-text);padding:2px 8px;border-radius:99px}
.roles{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:12px}
.roles button{border:0;background:transparent;color:inherit;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);font-weight:700}
.demo-bar{background:var(--info-bg);font-size:14px}
.demo-in{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.demo-in label{display:flex;gap:8px;align-items:center;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:18px 16px 90px}
h2{font-size:22px;margin:0 0 4px}
h3{font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 18px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel.flat{border-radius:4px}
.strip{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.strip b{font-size:19px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.tabs button:focus-visible,.roles button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--info-bg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px}
.o-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.o-top strong{font-size:17px}
.o-meta{color:var(--muted);font-size:15px}
.o-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:8px}
select,input[type=number],input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px;max-width:100%}
input[type=number]{width:90px}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 8px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
.ring{width:46px;height:46px;flex:none;position:relative}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}
.wait-item{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.wait-item:last-child{border-bottom:0}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.v{padding:2px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.v.zero{background:var(--bad-bg);color:var(--bad);border-color:transparent;font-weight:700}
.v.low{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.big{font-size:24px;font-weight:700}
.note{background:var(--info-bg);border-radius:8px;padding:10px 12px;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:460px;margin-inline:auto;background:var(--head);color:var(--head-text);padding:12px 16px;border-radius:10px;z-index:40;font-weight:500}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:8px;font:inherit}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;border:0;background:var(--accent);color:var(--accent-text);font-weight:700;padding:12px 18px;border-radius:99px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.fab[hidden]{display:none}
.aipanel{position:fixed;inset-inline-end:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));max-height:68vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:36;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.aipanel[hidden]{display:none}
.ai-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.ai-log{padding:12px 14px;overflow:auto;display:grid;gap:8px;flex:1;min-height:120px;align-content:start}
.ai-m{padding:8px 12px;border-radius:10px;background:var(--bg);white-space:pre-wrap}
.ai-m.me{background:var(--info-bg)}
.ai-in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ai-in input{flex:1;min-width:0}
@media (prefers-reduced-motion: reduce){.ring .fg{transition:none}}
@media (max-width:560px){main{padding-inline:12px}.btn{flex:1 1 auto;justify-content:center}}
</style>
</head>

function stockAlerts(){

function calcAcc(a){
  const sent=a.parcels;
  const rows=[["الشراء (الدفعة كاملة)",a.qty*a.buy],["التغليف",a.pack*sent],["الإتيكات",a.label*sent],["تغليف الرتور",a.retPack*a.retN],["التأكيد (مع الراجعة)",a.conf*a.confN],["السويفي (لكل طلبية متسلمة)",a.suiviRate*Math.max(0,a.parcels-a.retN-a.inDelP)],["الكرياتيف",a.creative],["مصاريف أخرى",a.other],["الأدس",a.usd*a.rate]];
  const exp=rows.reduce((t,r)=>t+r[1],0), profit=a.sales-exp, left=Math.max(0,a.qty-a.delN-a.inDel);
  const state=profit>=0?["ربح","ok"]:(a.selling?["قيد البيع","warn"]:["خسارة","bad"]);
  return {rows,exp,profit,left,state};
}
function rates(pid){
  const a=ACC[pid];
  const delivered=Math.max(0,a.parcels-a.retN-a.inDelP), closed=delivered+a.retN;
  const conf=a.ordersN?a.confN/a.ordersN:null;
  const ret=closed?a.retN/closed:null;
  const trust=closed>=SET.minSample&&ret!==null;
  return {delivered,closed,conf,ret,trust,retUsed:trust?ret:SET.returnPct/100};
}
function retBand(x){
  if(x===null||x===undefined) return null;

}

    const F=[["qty","كمية الشراء"],["buy","سعر الشراء"],["pack","تغليف لكل كولي"],["label","إتيكات لكل كولي"],["retPack","تغليف الرتور للكولي"],["conf","سعر التأكيد"],["confN","طلبيات مؤكدة (مع الراجعة)"],["ordersN","طلبات الحملة (كلها)"],["parcels","كوليات مبعوثة"],["inDelP","كوليات في التوصيل"],["delN","قطع متسلمة"],["retN","كوليات راجعة"],["inDel","قطع في التوصيل"],["sales","مجموع النات (المبيعات)"],["suiviRate","سعر السويفي لكل طلبية متسلمة"],["creative","الكرياتيف"],["other","مصاريف أخرى (مع نقل السلعة)"],["usd","أدس بالدولار"],["rate","سعر الصرف"]];
    body=`<div class="note" style="margin-bottom:12px">الأرقام هنا للتجربة. المبيعات والكميات تجي من شركة التوصيل، والباقي يتدخل يدويا. الفايدة = المبيعات − كل المصاريف، والقطع الباقية تتعتبر فايدة كي تكون النتيجة موجبة.</div>`+PRODUCTS.map(p=>{const a=ACC[p.id],r=calcAcc(a);
      return `<section class="panel" style="margin-bottom:14px"><div class="o-top"><h3>${esc(p.name)} <span class="o-meta">${esc(BRANCHES.find(b=>b.id===p.branch).name)}</span></h3><span class="chip ${r.state[1]}">${r.state[0]}</span></div>
      <div class="grid g2"><div>
        <div class="o-row">${F.map(([k,l])=>`<label class="f">${l}<input type="number" min="0" data-chg="acc" data-id="${p.id}" data-f="${k}" value="${a[k]}"></label>`).join("")}</div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:12px;cursor:pointer"><input type="checkbox" data-chg="accsell" data-id="${p.id}" ${a.selling?"checked":""}> المنتج مازال يتباع</label>
      </div><div>
        <div class="kv"><span>المبيعات</span><b class="num">${fmt(a.sales)}</b></div>
        ${r.rows.map(x=>`<div class="kv"><span>${x[0]}</span><span class="num">− ${fmt(x[1])}</span></div>`).join("")}
        <div class="kv"><span>مجموع المصاريف</span><b class="num">${fmt(r.exp)}</b></div>
        <div class="kv"><span>الفايدة</span><b class="big num" style="color:var(--${r.profit>=0?"ok":"bad"})">${fmt(r.profit)} دج</b></div>
        <div class="o-meta" style="margin-top:6px">قطع باقية في الستوك: <span class="num">${r.left}</span>${r.profit>=0?" (تتعتبر فايدة)":""}</div>
      </div></div></section>`}).join("");
  }
  if(tab==="qty"){
    const sum=p=>Object.values(p.v).reduce((a,b)=>a+b,0);
    const inDel=p=>ORDERS.filter(o=>o.status==="sent").reduce((a,o)=>a+(o.lines||[]).filter(l=>l.pid===p.id).length,0);
    const exp=p=>Math.round(inDel(p)*rates(p.id).retUsed);
    const rets=p=>RETURNS.filter(r=>r.p===p.name).reduce((a,r)=>a+r.q,0);
    const hint=p=>{const n=sum(p)+exp(p),on=CAMP[p.id];
      if(n===0) return ["خلص","bad","السلعة خلصت. وقف الحملة حتى تجيك سلعة ولا ترجع."];
      if(on&&n<=SET.lowQty) return ["قليلة","warn","الكمية قليلة والحملة تخدم. قلل الميزانية ولا وقفها."];
      if(!on) return ["كاينة","ok","فيها سلعة والحملة موقفة. تقدر تعاود تفتحها."];
      if(n>=SET.bigQty) return ["كبيرة","ok","كمية كبيرة والحملة تخدم. تقدر تزيد في الميزانية."];
      return ["عادية","","الكمية مليحة. كمل كيما راك."]};
    body=`<div class="note" style="margin-bottom:12px">هنا تشوف السلعة اللي بقات في كل فرع، باش تقرر واش تعاود تفتح الحملة ولا تزيد فيها. الاقتراح يحسب الكمية <b>بعد الرتور المتوقع</b>، بنسبة الرتور تاع كل منتج من الواقع (وإلا ما كفاتش المعطيات، النسبة الافتراضية ${SET.returnPct}%). والقرار تاعك.</div>
    <div class="panel scroll"><table><thead><tr><th>المنتج</th><th>الفرع</th><th>المتوفر الآن</th><th>في التوصيل</th><th>المتوقع يرجع</th><th>متاح بعد الرتور</th><th>رتور مسجل</th><th>الحملة</th><th>الوضعية</th></tr></thead><tbody>${PRODUCTS.map(p=>{const h=hint(p),r=rates(p.id);return `<tr><td><b>${esc(p.name)}</b>${vchips(p)}</td><td>${esc(BRANCHES.find(b=>b.id===p.branch).name)}</td><td class="num">${sum(p)}</td><td class="num">${inDel(p)}</td><td class="num">≈ ${exp(p)}<div class="o-meta">${Math.round(r.retUsed*100)}% ${r.trust?"(واقع)":"(افتراضي)"}</div></td><td class="big num">${sum(p)+exp(p)}</td><td class="num">${rets(p)}</td><td><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" data-chg="camp" data-id="${p.id}" ${CAMP[p.id]?"checked":""}> تخدم</label></td><td><span class="chip ${h[1]}">${h[0]}</span><div class="o-meta">${h[2]}</div></td></tr>`}).join("")}</tbody></table></div>
    <section class="panel" style="margin-top:14px"><h3>مجموع كل فرع</h3>${BRANCHES.map(b=>{const L=PRODUCTS.filter(p=>p.branch===b.id);const t=L.reduce((a,p)=>a+sum(p),0), e=L.reduce((a,p)=>a+exp(p),0);return `<div class="kv"><span>${esc(b.name)}</span><span><b class="num">${t}</b> <span class="o-meta">(≈ ${t+e} بعد الرتور)</span></span></div>`}).join("")}</section>`;

  if(tab==="cost"){
    const d=n=>isFinite(n)&&n>0?"$"+n.toFixed(2):"-";
    const pc=x=>x===null?"-":Math.round(x*100)+"%";
    body=`<div class="note" style="margin-bottom:12px">كل رقم هنا يتحسب من الواقع، منتج منتج. <b>نسبة الرتور</b> = الراجع ÷ (المتسلم + الراجع). إذا الكوليات المغلقة قليلة (أقل من ${SET.minSample})، نستعمل النسبة الافتراضية ${SET.returnPct}%. والكوليات اللي مازال في التوصيل نحسبو منها نفس النسبة. ونسبة الرتور بين ${SET.retLow}% و${SET.retHigh}% تتحسب <b>عادية</b>، وتحتها منخفضة وفوقها مرتفعة.</div>

    <p class="sub" style="margin-top:10px">"فايدة بعد التسليم المتوقع" = الفايدة الحالية + (الكوليات اللي في التوصيل × نسبة التسليم × متوسط البيع للكولي). رقم تقريبي للقرار، ماشي حساب نهائي. الأرقام تتعدل في تبويب "محاسبة المنتج".</p>`;
  }
    if(tab==="bl"){
    body=`<section class="panel" style="margin-bottom:14px"><h3>زيد رقم في ليست نوار</h3><div class="o-row">
      <label class="f">الهاتف<input type="text" id="bl-phone" dir="ltr" inputmode="tel"></label>

      <div class="panel scroll"><table><thead><tr><th>الهاتف</th><th>الاسم</th><th>السبب</th><th>التاريخ</th><th>أضافو</th><th></th></tr></thead><tbody>${BLACKLIST.map((b,i)=>`<tr><td class="num">${esc(b.phone)}</td><td>${esc(b.name||"-")}</td><td>${esc(b.reason)}</td><td>${esc(b.d)}</td><td>${esc(b.by)}</td><td><button class="btn sm" data-act="delbl" data-i="${i}">حذف</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">القائمة فارغة.</td></tr>`}</tbody></table></div>`;
  }
  if(tab==="sv"){
    body=`<section class="panel" style="margin-bottom:14px"><h3>زيد سويفي <span class="o-meta">(عندك ${SUIVI.length})</span></h3><div class="o-row">
      <label class="f">الاسم<input type="text" id="sv-name"></label>
      <label class="f">الإيميل<input type="text" id="sv-mail" dir="ltr"></label>
      <label class="f">الهاتف<input type="text" id="sv-phone" dir="ltr"></label>
      <label class="f">تاريخ الدخول<input type="date" id="sv-date"></label>
      <label class="f">الفرع<select id="sv-br">${BRANCHES.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select></label>
      <button class="btn pri" data-act="addsv">زيد سويفي</button></div></section>
      <div class="panel scroll"><table><thead><tr><th>السويفي</th><th>الإيميل</th><th>الهاتف</th><th>تاريخ الدخول</th><th>الفرع وشركة التوصيل</th><th>الشهرية</th></tr></thead><tbody>${SUIVI.map(x=>{const b=BRANCHES.find(y=>y.id===x.branch);return `<tr><td>${esc(x.name)}</td><td class="num">${esc(x.email)}</td><td class="num">${esc(x.phone)}</td><td class="num">${esc(x.joined||"-")}</td><td>${esc(b.name)}<div class="o-meta">${esc(b.dc)}</div></td><td class="num">${fmt(SUIVI_PAY)} دج</td></tr>`}).join("")}</tbody></table></div>
      <div class="kv" style="margin-top:12px"><span>مجموع الشهريات</span><b class="num">${fmt(SUIVI.length*SUIVI_PAY)} دج</b></div>
      <p class="sub" style="margin-top:8px">السويفي يتخلص شهرية ثابتة، ماشي بالطلبية. وكل سويفي يشوف غير كوليات شركة التوصيل تاع فرعو.</p>`;
  }
  if(tab==="set"){
    body=`<section class="panel" style="margin-bottom:14px"><h3>مصدر الطلبات</h3>
      <div class="o-row" style="margin-bottom:10px">
        <label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="radio" name="src" data-chg="src" value="sheet" ${SET.source==="sheet"?"checked":""}> نقرا الطلبات من شيتات جوجل</label>
        <label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="radio" name="src" data-chg="src" value="direct" ${SET.source==="direct"?"checked":""}> بلا شيت (الطلبات تدخل مباشرة)</label></div>
      ${SET.source==="sheet"?`<div class="note" style="margin-bottom:12px">زيد قدما تحب من الشيتات. كل شيت عندو نوع: طلبات عادية، ولا طلبات متروكة (abandoned checkout) اللي تدخل لقائمة المؤكدات مع الباقي. المؤكدة ما تعرفش أنها متروكة، وأنت وحدك تشوف النوع.</div>
        ${SOURCES.map(x=>`<div class="wait-item"><div class="o-row" style="flex:1;min-width:260px">
          <label class="f" style="min-width:150px">الاسم<input type="text" data-chg="srcf" data-id="${x.id}" data-f="name" value="${esc(x.name)}"></label>
          <label class="f">النوع<select data-chg="srcf" data-id="${x.id}" data-f="type"><option value="orders" ${x.type==="orders"?"selected":""}>طلبات عادية</option><option value="abandoned" ${x.type==="abandoned"?"selected":""}>طلبات متروكة</option></select></label>
          <label class="f" style="flex:1;min-width:220px">رابط الشيت<input type="text" dir="ltr" data-chg="srcf" data-id="${x.id}" data-f="url" value="${esc(x.url)}" placeholder="https://docs.google.com/spreadsheets/..."></label>
          <label class="f">كل (دقيقة)<input type="number" min="1" data-chg="srcf" data-id="${x.id}" data-f="syncMin" value="${x.syncMin}"></label></div>
          <div class="actions"><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" data-chg="srcon" data-id="${x.id}" ${x.on?"checked":""}> مفعل</label>
          <span class="chip ${x.url?"warn":""}">${x.url?"ينتظر الربط":"بلا رابط"}</span>
          <button class="btn sm bad" data-act="delsrc" data-id="${x.id}">حذف</button></div></div>`).join("")}
        <div style="margin-top:12px"><button class="btn" data-act="addsrc">زيد شيت</button></div>
        <div class="note" style="margin-top:12px">السيرفر هو اللي يقرا الشيتات بإذن من حساب جوجل تاعك، وكل صف يتقرا مرة وحدة.</div>`
      :`<div class="note">بلا شيت، الطلبات تدخل مباشرة من الحملة (فورم صفحة الهبوط ولا فيسبوك Leads) للموقع، وما تحتاج حتى ورقة وسيطة.</div>`}</section>
      <section class="panel"><h3>وقت الانتظار قبل الإرسال</h3><div class="o-row"><label class="f">بالدقائق<input type="number" min="0" id="set-wait" value="${SET.waitMin}"></label><button class="btn pri" data-act="saveset2">حفظ</button></div><p class="sub" style="margin:8px 0 0">كل طلبية مؤكدة تستنى هذي المدة وبعدها تتبعث لشركة التوصيل.</p></section>
      <section class="panel" style="margin-top:14px"><h3>حدود الكمية</h3><p class="sub" style="margin:0 0 8px">تستعملها اقتراحات تبويب "الكميات المتبقية".</p><div class="o-row"><label class="f">قليلة (أو أقل)<input type="number" min="0" id="set-low" value="${SET.lowQty}"></label><label class="f">كبيرة (أو أكثر)<input type="number" min="0" id="set-big" value="${SET.bigQty}"></label><label class="f">رتور افتراضي (%) كي ما تكفيش المعطيات<input type="number" min="0" max="100" id="set-ret" value="${SET.returnPct}"></label><label class="f">أقل كوليات مغلقة باش نثق في نسبة المنتج<input type="number" min="1" id="set-min" value="${SET.minSample}"></label><label class="f">رتور عادي من (%)<input type="number" min="0" max="100" id="set-rl" value="${SET.retLow}"></label><label class="f">رتور عادي إلى (%)<input type="number" min="0" max="100" id="set-rh" value="${SET.retHigh}"></label><button class="btn pri" data-act="saveset3">حفظ</button></div></section>`;
  }
    if(tab==="dc"){
    body=`<div class="panel scroll"><table><thead><tr><th>الفرع</th><th>شركة التوصيل</th><th>المنتجات المربوطة</th><th>الـAPI</th></tr></thead><tbody>${BRANCHES.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.dc)}</td><td>${PRODUCTS.filter(p=>p.branch===b.id).map(p=>esc(p.name)).join("، ")||"-"}</td><td><span class="chip warn">ينتظر الربط</span></td></tr>`).join("")}</tbody></table></div><div class="note" style="margin-top:12px">مفتاح الـAPI تاع كل شركة توصيل ما يتحطش في هذي الصفحة. يتخزن في سيرفر خاص، وهو اللي يبعث الطلبيات ويرجع الحالة (متسلمة، راجعة).</div>`;
  }
  if(tab==="conf"){
    const un=ORDERS.filter(o=>o.status==="new"&&!ASSIGN[o.pid]).length;
    body=`<section class="panel" style="margin-bottom:14px"><h3>زيد مؤكدة <span class="o-meta">(عندك ${CONFIRMERS.length}، وما كاين حد)</span></h3>
      <div class="o-row">
        <label class="f">الاسم<input type="text" id="cf-name"></label>
        <label class="f">الإيميل<input type="text" id="cf-mail" inputmode="email" dir="ltr"></label>
        <label class="f">الهاتف<input type="text" id="cf-phone" inputmode="tel" dir="ltr"></label>
        <label class="f">تاريخ الدخول<input type="date" id="cf-date"></label>
        <button class="btn pri" data-act="addconf">زيد مؤكدة</button></div>
      <div class="note" style="margin-top:10px">في الموقع الحقيقي، المؤكدة تستلم دعوة بالإيميل وهي اللي تختار كلمة السر تاعها. كلمة السر ما تتخزنش في الصفحة ولا تتشاف من عندك.</div></section>
    <section class="panel" style="margin-bottom:14px"><h3>توزيع المنتجات على المؤكدات</h3>
      ${un?`<div class="note" style="margin-bottom:10px;background:var(--warn-bg);color:var(--warn)">كاين ${un} طلبية جديدة لمنتجات بلا مؤكدة.</div>`:""}
      <div class="scroll"><table><thead><tr><th>المنتج</th><th>المؤكدة</th></tr></thead><tbody>${PRODUCTS.map(p=>`<tr><td>${esc(p.name)}</td><td><select data-chg="assign" data-id="${p.id}" aria-label="المؤكدة"><option value="">بلا مؤكدة</option>${CONFIRMERS.map(c=>`<option ${ASSIGN[p.id]===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div></section>
    <div class="panel scroll"><table><thead><tr><th>المؤكدة</th><th>الإيميل</th><th>الهاتف</th><th>تاريخ الدخول</th><th>الدورة الحالية</th><th>طلبيات مؤكدة</th><th>المستحق (${PAY_PER_CONFIRM} دج للطلبية)</th><th>رسالة الخلاص</th></tr></thead><tbody>${
      CONFIRMERS.map(c=>{const n=confirmedCount(c.name);return `<tr><td>${esc(c.name)}</td><td class="num">${esc(c.email||"-")}</td><td class="num">${esc(c.phone||"-")}</td><td class="num">${esc(c.joined||"-")}</td><td class="num">${cycleTxt(c.joined).a} ← ${cycleTxt(c.joined).b}</td><td class="num">${n}</td><td class="num">${fmt(n*PAY_PER_CONFIRM)} دج</td><td><button class="btn sm" data-act="msg" data-name="${esc(c.name)}">أنشئ الرسالة</button></td></tr>`}).join("")
    }</tbody></table></div><div id="msgbox" class="panel" style="margin-top:12px" hidden><h3>الرسالة</h3><textarea id="msgtxt" readonly></textarea><div class="actions" style="margin-top:8px"><button class="btn" data-act="copy">انسخ</button></div></div>
    <p class="sub" style="margin-top:10px">التأكيدات تتحسب من لحظة التأكيد، وتتشطب إذا الطلبية تلغات في فترة الانتظار.</p>`;
  }
    return `<h2>لوحة المدير</h2><p class="sub">تشوف كل شيء: الطلبات، الفروع، الدراهم، والستوك.</p>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="tab" data-tab="${k}">${l}</button>`).join("")}</div>${body}`;
}

/* ---------- واجهة: الفرع ---------- */
function newStockForm(prods){
  return `<section class="panel" style="margin-bottom:14px"><h3>وصلتك سلعة؟</h3><p class="sub" style="margin:0 0 8px">اكتب اسم المنتج. إذا كان عندك، تتزاد الكمية للون والمقاس. وإذا منتج جديد، يتسجل وينتظر مراجعة المدير (السعر والمؤكدة).</p>
  <div class="o-row">
    <label class="f" style="min-width:200px">اسم المنتج<input type="text" id="ns-name" list="ns-list" placeholder="مثلا: بيجامة قطيفة"></label>

function render(){
  document.querySelectorAll(".roles button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.role===S.role));
  $("#app").innerHTML = S.role==="mgr"?viewMgr():S.role==="conf"?viewConf():S.role==="sv"?viewSv():viewBr();
  updateAiFab();
  tick(true);
}
function tick(noProcess){
  let changed=false; const t=Date.now();
  ORDERS.forEach(o=>{ if(o.status==="wait" && t>=o.sendAt && !noProcess){ sendOrder(o); changed=true; } });
  if(changed){ render(); toast("طلبية تبعثت أوتوماتيك لشركة التوصيل."); return; }
  document.querySelectorAll("[data-ring]").forEach(el=>{
    const o=ORDERS.find(x=>x.id==el.dataset.ring); if(!o) return;
    const left=Math.max(0,o.sendAt-t), r=Math.min(1,left/o.total);
    el.querySelector(".fg").style.strokeDashoffset=(113.1*(1-r)).toFixed(1);
    const s=Math.ceil(left/1000);
    el.querySelector("span").textContent = s>=120? Math.ceil(s/60)+"د" : s+"ث";
  });
}
setInterval(()=>tick(false),1000);

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=+el.dataset.id, o=ORDERS.find(x=>x.id===id);
  if(a==="role"){S.role=el.dataset.role;render();return}

    const ps=[...document.querySelectorAll(`[data-chg="opid"][data-id="${id}"]`)].map(x=>x.value);
    const vs=[...document.querySelectorAll(`[data-chg="opick"][data-id="${id}"]`)].map(x=>x.value);
    const lines=ps.map((pid,i)=>({pid,v:vs[i]}));
    if(!lines.length||lines.some(l=>!l.v)){toast("اختار المنتج واللون والمقاس.");return}
    const need={}; lines.forEach(l=>{const k=l.pid+"|"+l.v; need[k]=(need[k]||0)+1});
    const bad=Object.keys(need).find(k=>{const [pid,v]=k.split("|"); return !(prod(pid).v[v]>=need[k])});
    if(bad){toast("الكمية المتوفرة من "+bad.split("|")[1]+" ما تكفيش.");return}
    lines.forEach(l=>{prod(l.pid).v[l.v]--});
    o.lines=lines; o.qty=lines.length; o.var=linesText(o);
    o.status="wait"; o.by=S.me; o.total=waitMs(); o.sendAt=Date.now()+o.total;
    delete S.qty[id]; delete S.pick[id];

    const p=prod(el.dataset.id), c=$("#nvc-"+p.id).value.trim(), z=$("#nvs-"+p.id).value.trim(), q=Math.max(0,+$("#nvq-"+p.id).value||0);
    if(!c||!z){toast("دخل اللون والمقاس.");return}
    const k=c+" / "+z; p.v[k]=(p.v[k]||0)+q; p.upd="اليوم الآن"; render(); toast("تزاد المتغير للستوك."); return;
  }
  if(a==="addret"){
    const R=S.ret; let ord=null;
    if(R.order){const oid=String(R.order).split("|")[0]; ord=ORDERS.find(x=>String(x.id)===oid)}
    if(ord){
      const mine=(ord.lines||[]).filter(x=>prod(x.pid).branch===S.branch);
      mine.forEach(l=>{const pp=prod(l.pid);pp.v[l.v]=(pp.v[l.v]||0)+1});
      ord.retBr=ord.retBr||{}; ord.retBr[S.branch]=true;
      if(brIds(ord).every(b=>ord.retBr[b])) ord.status="returned";
      RETURNS.push({b:S.branch,trk:(ord.tracks||{})[S.branch]||"",p:[...new Set(mine.map(l=>prod(l.pid).name))].join("، "),v:mine.map(l=>l.v).join(" + "),q:mine.length});
    } else {
      const pr=prod(R.pid); if(!pr||!R.color||!R.size){toast("اختار المنتج واللون والمقاس.");return}
      const v=R.color+" / "+R.size, q=R.qty;
      pr.v[v]=(pr.v[v]||0)+q; RETURNS.push({b:S.branch,trk:"",p:pr.name,v,q});
    }
    S.ret={pid:"",color:"",size:"",qty:1,order:""}; render();
    toast("تسجل الرتور ورجع للستوك."); return;
  }
  if(a==="saveliq"){BRANCHES.find(b=>b.id===S.branch).liq=+$("#liq").value||0;render();toast("تحدثت السيولة.");return}
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-chg]"); if(!el) return;
  const c=el.dataset.chg;
  if(c==="var"){const o=ORDERS.find(x=>x.id==el.dataset.id),i=+el.dataset.i||0,l=o.lines[i],pp=prod(l.pid),nv=el.value;
    if(nv!==l.v){ if(!(pp.v[nv]>0)){toast("هذا اللون خلص.");render();return} pp.v[l.v]++; pp.v[nv]--; l.v=nv; o.var=linesText(o)}
    render(); toast("تبدلت القطعة."); return}
  if(c==="wpid"){const o=ORDERS.find(x=>x.id==el.dataset.id),i=+el.dataset.i||0,l=o.lines[i],np=prod(el.value);
    if(np.id!==l.pid){const nv=Object.keys(np.v).find(k=>np.v[k]>0);
      if(!nv){toast("هذا المنتج خلص.");render();return}
      const op=prod(l.pid); op.v[l.v]++; np.v[nv]--; l.pid=np.id; l.v=nv; o.var=linesText(o)}
    render(); toast("تبدل منتج القطعة."); return}
  if(c==="branch"){prod(el.dataset.id).branch=el.value;render();toast("تبدل الفرع المربوط.");return}
  if(c==="curbr"){S.branch=el.value;render();return}
  if(c==="assign"){ASSIGN[el.dataset.id]=el.value;render();toast("تبدل التوزيع.");return}
  if(c==="curconf"){S.me=el.value;render();return}
  if(c==="src"){SET.source=el.value;render();return}
  if(c==="camp"){CAMP[el.dataset.id]=el.checked;render();return}
  if(c==="oqty"){S.qty[el.dataset.id]=+el.value;render();return}
  if(c==="opid"){const k=el.dataset.id;S.pick[k]=S.pick[k]||[];S.pick[k][+el.dataset.i]={pid:el.value,v:""};render();return}
  if(c==="opick"){const k=el.dataset.id;S.pick[k]=S.pick[k]||[];S.pick[k][+el.dataset.i]={pid:el.dataset.p,v:el.value};return}
  if(c==="brtype"){BRANCHES.find(b=>b.id===el.dataset.id).type=el.value;render();return}
  if(c==="retorder"){S.ret.order=el.value; const oid=String(el.value).split("|")[0], o=ORDERS.find(x=>String(x.id)===oid);
    if(o){const mine=(o.lines||[]).filter(x=>prod(x.pid).branch===S.branch); const ln=mine[0]; if(ln){const parts=ln.v.split(" / ");S.ret.pid=ln.pid;S.ret.color=parts[0];S.ret.size=parts[1]||"";S.ret.qty=mine.length||1}}
    render();return}
  if(c==="retf"){const f=el.dataset.f;S.ret.order="";S.ret[f]=f==="qty"?+el.value:el.value;
    if(f==="pid"){S.ret.color="";S.ret.size=""} if(f==="color"){S.ret.size=""}
    render();return}
  if(c==="srcf"){const x=SOURCES.find(y=>y.id==el.dataset.id), f=el.dataset.f; let v=el.value;
    if(f==="url"){v=v.trim(); if(v&&!v.startsWith("https://docs.google.com/spreadsheets/")){toast("الرابط لازم يكون تاع شيت جوجل.");render();return}}
    if(f==="syncMin") v=Math.max(1,+v||5);
    x[f]=v; render(); return}
  if(c==="srcon"){SOURCES.find(y=>y.id==el.dataset.id).on=el.checked;render();return}
  if(c==="cursv"){S.sv=el.value;render();return}
  if(c==="follow"){ORDERS.find(x=>x.id==el.dataset.id).follow=el.value;toast("تسجلت المتابعة.");return}
  if(c==="acc"){ACC[el.dataset.id][el.dataset.f]=Math.max(0,+el.value||0);render();return}
  if(c==="accsell"){ACC[el.dataset.id].selling=el.checked;render();return}
});
/* ---------- المساعد ---------- */
function updateAiFab(){const show=S.role==="mgr"&&!!SAMPLE;$("#ai-fab").hidden=!show;if(!show)$("#ai").hidden=true}
(async()=>{try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use("sample")}}catch(_){SAMPLE=null}updateAiFab()})();
const norm=x=>String(x||"").trim().replace(/\s+/g," ").toLowerCase();
function findOne(list,q,getName,what){
  const n=norm(q); if(!n) throw new Error("ما عطيتنيش "+what);
  let m=list.filter(x=>norm(getName(x))===n);
  if(!m.length) m=list.filter(x=>norm(getName(x)).includes(n)||n.includes(norm(getName(x))));
  if(!m.length) throw new Error("ما لقيتش "+what+" بهذا الاسم: "+q);
  if(m.length>1) throw new Error("اسم "+what+" غامض: "+m.map(getName).join("، "));
  return m[0];
}
const AI_RULES = "أنت مساعد داخل لوحة عمل ياسين (تجارة إلكترونية في الجزائر). تهضر بالدارجة الجزائرية البسيطة وباختصار. ما تقولش دابا ولا الفلوس، قل ذركا والدراهم. مهمتك الوحيدة: توزيع المنتجات على المؤكدات. كل منتج يتوزع على مؤكدة واحدة وطلباتو تروح لها. استعمل الأدوات. ما تخترعش أسماء منتجات ولا مؤكدات، وإذا الاسم غامض ولا ما لقيتوش اسقسي ياسين. إذا طلب حاجة خارج التوزيع، قولو بلي ذركا تخدم على التوزيع غير. بعد ما تنفذ، قولو واش تبدل بالضبط.";
const AI_TOOLS = [
  {name:"get_state",description:"يرجع أسماء المنتجات والمؤكدة اللي موزع عليها كل منتج، وأسماء المؤكدات. استعملو قبل أي تعديل.",
   execute:()=>({products:PRODUCTS.map(p=>({name:p.name,assigned_to:ASSIGN[p.id]||null})),confirmers:CONFIRMERS.map(c=>c.name)})},
  {name:"assign_product",description:"يوزع منتج على مؤكدة. product: اسم المنتج. confirmer: اسم المؤكدة. يرجع واش تبدل.",
   inputSchema:{type:"object",properties:{product:{type:"string"},confirmer:{type:"string"}},required:["product","confirmer"]},
   execute:(inp)=>{
     if(S.role!=="mgr") throw new Error("هذا للمدير فقط");
     const p=findOne(PRODUCTS,inp.product,x=>x.name,"المنتج");
     const c=findOne(CONFIRMERS,inp.confirmer,x=>x.name,"المؤكدة");
     const before=ASSIGN[p.id]||"بلا مؤكدة"; ASSIGN[p.id]=c.name; render();
     return {ok:true,product:p.name,from:before,to:c.name};
   }}
];
function aiLog(){
  const box=$("#ai-log"); box.textContent="";
  if(!AI.turns.length){const d=document.createElement("div");d.className="ai-m";d.textContent="قولي مثلا: بيجامة قطيفة عطيها للمؤكدة ب. ولا: وزع كل المنتجات على المؤكدة ج.";box.append(d)}
  AI.turns.forEach(t=>{const d=document.createElement("div");d.className="ai-m"+(t.role==="user"?" me":"");d.textContent=t.content;box.append(d)});
  if(AI.busy){const d=document.createElement("div");d.className="ai-m";d.textContent="يفكر...";box.append(d)}
  box.scrollTop=box.scrollHeight;
}
async function aiSend(){
  const inp=$("#ai-text"), q=inp.value.trim(); if(!q||AI.busy||!SAMPLE) return;
  inp.value=""; AI.turns.push({role:"user",content:q}); AI.busy=true; AI.ctl=new AbortController(); aiLog();
  try{
    const r=await SAMPLE([{role:"user",content:AI_RULES},{role:"assistant",content:"فهمت، جاهز."},...AI.turns],{tools:AI_TOOLS,signal:AI.ctl.signal,modelTier:"quick"});
    AI.turns.push({role:"assistant",content:r.text});
  }catch(e){
    const c=e&&e.code;
    AI.turns.push({role:"assistant",content:c==="not_granted"?"ما سمحتش للمساعد يخدم. تقدر تعاود تسمحلو من إعدادات الصفحة.":c==="cancelled"?"توقف.":"ما قدرتش نكمل ("+(c||"خطأ")+"). عاود المحاولة."});
  }
  AI.busy=false; aiLog();
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="ai-text"){e.preventDefault();aiSend()}});

render();
